        <main>
           <!--this will be the input form-->
           <h2 id="submit-details">Submit your details</h2>
           <div class="container">
            <form id="contact-form">
                <div>
                    <label for="full-name">Name</label>
                    <input required type="text" id="full-name" name="name" placeholder="Full name" oninput="validateForm()" />
                </div>
            
                <div>
                    <label for="email">Email</label>
                    <input required type="email" id="email" name="email" placeholder="Email" />
                </div>
            
                <div>
                    <label for="message">Message</label>
                    <textarea required name="message" id="message" placeholder="Ask for a quote or more details." cols="30" rows="10"></textarea>
                </div>
            
                <div class="file-input">
                    <label for="file"><img src="assets/images/upload-file-svgrepo-com.svg" alt="">upload files</label>
                    <input type="file" id="file" name="file" multiple />
                </div>

                <div class="button-container">
                    <button type="submit" value="submit" onclick="submitToAPI(event)">Send your message</button>
                </div>
            </form>
            </div>
            <div id="messageContainer"></div>
        </main>
